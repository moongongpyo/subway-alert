<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playground 체험</title><link rel="stylesheet" href="/style.css"><script type="module" src="/playground.js"></script></head><body class="embedded"><main id="experience"><div class="experience-heading"><div><span class="eyebrow muted">LIVE PLAYGROUND</span><h1 id="title">체험을 불러오고 있어요</h1><p id="description"></p></div><span class="pill">◈ 격리된 환경</span></div><div class="experience-grid"><section class="request-panel"><div class="panel-heading"><h2>요청 입력</h2><span>INPUT</span></div><form id="request-form"><div id="request-fields"></div><button class="primary execute-button" type="submit" aria-label="실행하기">실행하기 <span aria-hidden="true">→</span></button></form><p class="request-footnote">다시 실행해도 모델을 호출하지 않아요.</p></section><section class="result-panel"><div class="panel-heading"><h2>실행 결과</h2><div class="tabs"><button id="view-tab" class="selected" type="button">보기</button><button id="raw-tab" type="button">원본 JSON</button></div></div><div id="result" data-state="idle"><div class="empty-result"><span>↗</span><h3>가능성을 직접 확인하세요.</h3><p>입력값을 정하고 실행하면<br>실제 결과가 여기에 표시됩니다.</p></div></div><pre id="raw-json" hidden></pre><div id="result-meta" class="result-meta"></div></section></div></main></body></html>
