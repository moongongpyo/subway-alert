<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다음길 — 대중교통 경로 찾기</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><a class="brand" href="/">↗ 다음길</a><span>대중교통 경로 찾기</span></header>
<main><section class="search-panel" aria-labelledby="search-title"><h1 id="search-title">어디로 갈까요?</h1><p class="intro">갈 수 없는 구간은 피하고, 다음 경로를 찾아보세요.</p>
<form id="search-form"><div class="search-fields"><label>출발<select id="from"><option value="강남">강남역</option><option value="역삼">역삼역</option><option value="선릉">선릉역</option><option value="custom">다른 장소 · 좌표 입력</option></select></label><button type="button" id="swap" class="swap" aria-label="출발지와 도착지 바꾸기">⇄</button><label>도착<select id="to"><option value="강남">강남역</option><option value="역삼">역삼역</option><option value="선릉" selected>선릉역</option><option value="custom">다른 장소 · 좌표 입력</option></select></label><button id="search" class="primary" type="submit">경로 찾기</button></div>
<div id="custom-from" class="coordinates" hidden><label>출발 장소<input id="from-name" maxlength="80" placeholder="장소 이름"></label><label>경도<input id="from-lon" type="number" min="124" max="132" step="any" placeholder="127.0276"></label><label>위도<input id="from-lat" type="number" min="33" max="39" step="any" placeholder="37.4979"></label></div>
<div id="custom-to" class="coordinates" hidden><label>도착 장소<input id="to-name" maxlength="80" placeholder="장소 이름"></label><label>경도<input id="to-lon" type="number" min="124" max="132" step="any" placeholder="127.0482"></label><label>위도<input id="to-lat" type="number" min="33" max="39" step="any" placeholder="37.5043"></label></div>
<div class="search-options"><label><input type="checkbox" id="demo"> 예시 경로로 체험</label><span id="availability"></span></div></form></section>
<section id="result-section" aria-label="검색 결과"><p id="status" role="status" aria-live="polite">출발지와 도착지를 선택해 주세요.</p><div id="blocks"></div><div id="results"><div class="start-message"><span aria-hidden="true">↗</span><h2>나에게 맞는 길을 찾아보세요</h2><p>소요시간과 환승을 비교하고,<br>이용하기 어려운 구간은 상세 경로에서 제외하세요.</p></div></div></section>
<details class="notices"><summary>지하철 운행 공지 <span>서울교통공사</span></summary><p id="notice-status">공지를 확인하고 있습니다.</p><div id="notice-list"></div><a href="https://data.seoul.go.kr/dataList/OA-22718/A/1/datasetView.do" target="_blank" rel="noopener">공식 출처 확인 ↗</a></details>
<footer>경로·예상 시간 TMAP · 운행 공지 서울교통공사<br>실제 운행 상황은 탑승 전 확인해 주세요.</footer></main><div id="toast" role="alert" hidden></div></body></html>
